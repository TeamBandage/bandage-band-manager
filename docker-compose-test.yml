# 로컬 테스트용: 인프라(postgres/redis)만 named volume 으로 기동.
# 앱은 로컬 빌드(./gradlew bootRun)로 실행하므로 app 컨테이너는 포함하지 않는다.
# 데이터가 named volume(pgdata/redisdata)에 저장되어 프로젝트 루트에 ./db, ./redis 가 생기지 않는다.
# 사용: docker compose -f docker-compose-test.yml up -d
# 정리: docker compose -f docker-compose-test.yml down [-v]   (-v 는 볼륨까지 삭제)
services:
  postgres:
    image: postgres:15
    container_name: bandage-postgres
    environment:
      # POSTGRES_USER 는 관리 전용 슈퍼유저. 애플리케이션은 사용하지 않는다.
      POSTGRES_USER: ${DB_ADMIN}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # 최초 기동 시 01-roles.sh 가 owner/app 역할을 생성하는 데 사용한다.
      DB_OWNER: ${DB_OWNER}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP: ${DB_USER}
      DB_APP_PASSWORD: ${DB_USER_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    restart: always

  redis:
    image: redis:7-alpine
    container_name: bandage-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    restart: always

volumes:
  pgdata:
  redisdata:
