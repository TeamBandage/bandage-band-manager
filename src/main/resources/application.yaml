spring:
  application:
    name: v1
  autoconfigure:
    # 인증은 JwtAuthenticationFilter 로만 처리한다. 이 자동설정은 UserDetailsService 빈이
    # 없을 때 in-memory 사용자를 만들고 임시 비밀번호를 로그에 평문으로 남기므로 제외한다.
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    group:
      local: [local, default-datasource, swagger, redis, security, s3]
      dev: [dev, dev-datasource, swagger, redis, security, s3]
    active: ${PROFILE_ACTIVE:local}
  jpa:
    properties:
      hibernate:
        # 회원 탈퇴 시 다수 리소스의 권한 양도(update/insert/soft-delete)를 묶어 flush
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false