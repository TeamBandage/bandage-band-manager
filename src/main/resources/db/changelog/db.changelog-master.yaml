databaseChangeLog:
  - changeSet:
      id: 001-init-schema
      author: bandage
      comment: PostgreSQL 스키마 초기화 (pg_dump --schema-only 기준)
      changes:
        - sqlFile:
            path: changes/001-init-schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 002-setlist-selection-refactor
      author: bandage
      comment: |
        BD-43/BD-59 도메인 리팩토링 반영
        - p_performance_band / p_performance_practice 제거, p_performance_setlist 신설
        - p_setlist_meeting / p_setlist_item* → p_track_selection / p_track_selection_item* 으로 rename (PK·FK 컬럼 일괄 정리, is_selected 컬럼 추가)
        - p_track_selection_band, p_track_selection_member_band 신설
        - 셋리스트 확정 도메인 신설: p_setlist, p_setlist_band, p_setlist_track, p_setlist_track_session, p_setlist_track_participant
      changes:
        - sqlFile:
            path: changes/002-setlist-selection-refactor.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 003-seed-developer-account
      author: bandage
      comment: |
        개발용 기본 DEVELOPER 계정 시드
        - developer@bandage.com / 11111111 (BCrypt cost=10)
        - p_member, p_member_auth 양쪽 INSERT (멱등 처리)
      changes:
        - sqlFile:
            path: changes/003-seed-developer-account.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 004-trackinfo-and-drop-practice-song
      author: bandage
      comment: |
        BD-70 P1-a/b: TrackInfo 임베디드 도입 및 PracticeSong 제거
        - p_practice: song_id FK/컬럼 제거, track_*(title/artist/album/duration:int/reference) + note 컬럼 추가
        - p_practice_song 테이블 제거
        - p_setlist_track / p_track_selection_item: practice_song_id 제거, duration varchar→int, reference 추가
      changes:
        - sqlFile:
            path: changes/004-trackinfo-and-drop-practice-song.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 005-practice-participant-session-and-setlist-id
      author: bandage
      comment: |
        BD-70 P1-c: 세션/참여자 모델 정합화 + setlistId
        - p_practice.setlist_id 추가
        - p_practice_participant.session_id 추가 + (practice_id, session_id, member_id) UK
        - PracticeSession 엔티티 테이블 제거 후 SessionDef ElementCollection 테이블로 재생성
      changes:
        - sqlFile:
            path: changes/005-practice-participant-session-and-setlist-id.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 006-rename-practice-to-jam
      author: bandage
      comment: |
        BD-70 P2: Practice → Jam 도메인 리네이밍
        - p_practice → p_jam, p_practice_participant → p_jam_participant, p_practice_session → p_jam_session
        - practice_id → jam_id, practice_participant_id → jam_participant_id 컬럼 rename
        - PK/UK/FK 제약명 정리
      changes:
        - sqlFile:
            path: changes/006-rename-practice-to-jam.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 008-member-availability
      author: bandage
      comment: |
        BD-33 (PRD-2 Task 2): MemberAvailability 도메인 테이블 신설
        - p_member_availability (member_id PK)
        - p_member_availability_weekly_rules / p_member_availability_exceptions (ElementCollection)
      changes:
        - sqlFile:
            path: changes/008-member-availability.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 009-jam-reservation
      author: bandage
      comment: |
        BD-33 (PRD-2 Task 3): JamReservation 추적 테이블 신설
        - p_jam_reservation (멤버별 Jam 점유 시간 구간, delete-reinsert 동기화)
      changes:
        - sqlFile:
            path: changes/009-jam-reservation.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 010-schedule-board-performance
      author: bandage
      comment: |
        BD-33 (PRD-2 Task 5): ScheduleBoard 스코프 meeting → performance 이전
        - performance_id 추가(NOT NULL), meeting_id nullable 화, window_from/to 추가
      changes:
        - sqlFile:
            path: changes/010-schedule-board-performance.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 011-schedule-block-track
      author: bandage
      comment: |
        BD-33 (PRD-2 Task 6): ScheduleBlock↔SetlistTrack N:M 매핑 테이블 신설
      changes:
        - sqlFile:
            path: changes/011-schedule-block-track.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 012-schedule-block-recurrence
      author: bandage
      comment: |
        BD-33 (PRD-2 Task 6/7): ScheduleBlock song_id 제거 + 반복/배치 메타데이터 추가
      changes:
        - sqlFile:
            path: changes/012-schedule-block-recurrence.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 013-schedule-block-jam
      author: bandage
      comment: |
        BD-33 (PRD-2 Task 8): ScheduleBlock → 확정 Jam 추적 매핑 테이블 신설
      changes:
        - sqlFile:
            path: changes/013-schedule-block-jam.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 014-performance-manager-role-and-invitation
      author: bandage
      comment: |
        BD-78: 공연 매니저 역할(OWNER/MANAGER) 컬럼 추가 + 공연 초대 테이블 신설
      changes:
        - sqlFile:
            path: changes/014-performance-manager-role-and-invitation.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 015-drop-member-contact
      author: bandage
      comment: |
        BD-84: Member contact 컬럼 제거
        - p_member.contact 컬럼 DROP (개인정보 노출 포인트 제거, 미사용 필드)
      changes:
        - sqlFile:
            path: changes/015-drop-member-contact.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 016-notification
      author: bandage
      comment: |
        BD-81: 알림(Notification) 도메인 테이블 신설
        - p_notification (수신자별 1행, category varchar STRING, is_read/read_at 읽음 처리)
        - 조회/멱등성 인덱스 추가
      changes:
        - sqlFile:
            path: changes/016-notification.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 017-soft-delete-partial-unique
      author: bandage
      comment: |
        BD-14: soft delete 리소스 plain UNIQUE → partial unique index 전환
        - p_member.email / p_member_auth.email / p_band.name
        - 활성(deleted_at IS NULL) 행만 유일성 보장, soft delete 후 동일 값 재등록 허용
      changes:
        - sqlFile:
            path: changes/017-soft-delete-partial-unique.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 018-performance-poster
      author: bandage
      comment: |
        공연 포스터(PerformancePoster) 도메인 테이블 신설
        - p_performance_poster (performance_id FK, s3_url, description)
      changes:
        - sqlFile:
            path: changes/018-performance-poster.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 019-jam-participant-session-nullable
      author: bandage
      comment: |
        BD-154: 합주 생성자 자동 참여 등록을 위해 p_jam_participant.session_id NOT NULL 해제
        - 생성자는 createJam 시 session_id=NULL 소속 레코드로 등록되어 "내 합주 목록"에 노출
      changes:
        - sqlFile:
            path: changes/019-jam-participant-session-nullable.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 020-performance-manager-member-index
      author: bandage
      comment: |
        BD-156: 내 공연 목록 직접 참여 경로 조회 인덱스
        - p_performance_manager.member_id 단독 인덱스 (UK가 performance_id 선두라 member_id 단독 조회엔 미사용)
      changes:
        - sqlFile:
            path: changes/020-performance-manager-member-index.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 021-drop-session-need
      author: bandage
      comment: |
        세션 "1세션=1인" 고정: SessionDef.need(정원) 필드 제거
        - p_track_selection_item_session / p_setlist_track_session / p_jam_session 의 session_need 컬럼 DROP
        - 정원 N명 세션은 이제 클라이언트가 세션을 N개(예: G-1, G-2) 등록하는 것으로 표현
      changes:
        - sqlFile:
            path: changes/021-drop-session-need.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 022-jam-participant-session-split
      author: bandage
      comment: |
        BD-205: JamParticipant(합주 소속)와 JamParticipantSession(세션 배정) 분리
        - p_jam_participant_session 신설(jam_participant_id, session_id), 기존 session_id 데이터 이행
        - p_jam_participant.session_id 컬럼 제거, (jam_id, member_id) partial unique index로 전환
      changes:
        - sqlFile:
            path: changes/022-jam-participant-session-split.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 023-jam-participant-session-soft-delete-columns
      author: bandage
      comment: |
        BD-205 후속 수정: p_jam_participant_session soft delete 컬럼 누락 보강
        - JamParticipantSession 은 BaseEntity 를 상속하나 022 마이그레이션에 deleted_at/deleted_by 컬럼이 빠져
          Hibernate 스키마 검증(ddl-auto=validate) 실패를 유발하던 문제 수정
      changes:
        - sqlFile:
            path: changes/023-jam-participant-session-soft-delete-columns.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 024-band-application-is-latest
      author: bandage
      comment: |
        BD-210: 밴드 가입 신청 재지원 시 최신/과거 이력 구분
        - p_band_application.is_latest 컬럼 추가, (band_id, member_id) 당 최신 1건만 true 로 백필
        - (band_id, member_id, is_latest=true) partial unique index 추가
      changes:
        - sqlFile:
            path: changes/024-band-application-is-latest.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 025-schedule-setlist-recreate
      author: bandage
      comment: |
        BD-172: schedule 도메인을 셋리스트 스코프로 재구성
        - p_schedule_board: setlist_id 추가, performance_id/meeting_id/palette_seed/version 제거
        - p_schedule_block: start_date/end_date/end_slot 추가, block_date/duration_slots/palette_index 제거, title_override → title
      changes:
        - sqlFile:
            path: changes/025-schedule-setlist-recreate.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 026-selection-setlist-refactor
      author: bandage
      comment: |
        BD-256/BD-218: 선곡 도메인 리팩토링
        - BD-256: p_track_selection 의 practice_window_from/practice_window_to 제거 (Schedule 도메인으로 이전)
        - BD-218: p_track_selection_item.proposer_id NOT NULL 해제 (선곡 회의 떠나기 시 제안자 연결 해제)
      changes:
        - sqlFile:
            path: changes/026-selection-setlist-refactor.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 027-schedule-board-setlist-item-placement
      author: bandage
      comment: |
        BD-272: 스케줄보드 ↔ 셋리스트 트랙 단위 자동배치 결과 테이블 신설
        - p_schedule_board_setlist_item_placement 생성 (트랙별 배치 회차 수, 0 이면 미배치)
      changes:
        - sqlFile:
            path: changes/027-schedule-board-setlist-item-placement.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 028-schedule-board-time-range
      author: bandage
      comment: |
        BD-272: 미사용 보드 제약 제거 및 배치 가능 시간대 필드 정리
        - working_hours_start/end → board_time_range_from/to 로 rename (슬롯 인덱스임을 이름에 반영, 값 보존)
        - exclude_late_night / max_consecutive_minutes 제거 (정의·변환·사용 로직 모두 부재)
      changes:
        - sqlFile:
            path: changes/028-schedule-board-time-range.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
