databaseChangeLog:
  - changeSet:
      id: 001-init-schema
      author: bandage
      comment: PostgreSQL 스키마 초기화 (pg_dump --schema-only 기준)
      changes:
        - sqlFile:
            path: changes/001-init-schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 002-setlist-selection-refactor
      author: bandage
      comment: |
        BD-43/BD-59 도메인 리팩토링 반영
        - p_performance_band / p_performance_practice 제거, p_performance_setlist 신설
        - p_setlist_meeting / p_setlist_item* → p_track_selection / p_track_selection_item* 으로 rename (PK·FK 컬럼 일괄 정리, is_selected 컬럼 추가)
        - p_track_selection_band, p_track_selection_member_band 신설
        - 셋리스트 확정 도메인 신설: p_setlist, p_setlist_band, p_setlist_track, p_setlist_track_session, p_setlist_track_participant
      changes:
        - sqlFile:
            path: changes/002-setlist-selection-refactor.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 003-seed-developer-account
      author: bandage
      comment: |
        개발용 기본 DEVELOPER 계정 시드
        - developer@bandage.com / 11111111 (BCrypt cost=10)
        - p_member, p_member_auth 양쪽 INSERT (멱등 처리)
      changes:
        - sqlFile:
            path: changes/003-seed-developer-account.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
