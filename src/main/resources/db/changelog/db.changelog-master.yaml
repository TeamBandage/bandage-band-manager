databaseChangeLog:
  - changeSet:
      id: 001-init-schema
      author: bandage
      comment: PostgreSQL 스키마 초기화 (pg_dump --schema-only 기준)
      changes:
        - sqlFile:
            path: changes/001-init-schema.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 002-setlist-selection-refactor
      author: bandage
      comment: |
        BD-43/BD-59 도메인 리팩토링 반영
        - p_performance_band / p_performance_practice 제거, p_performance_setlist 신설
        - p_setlist_meeting / p_setlist_item* → p_track_selection / p_track_selection_item* 으로 rename (PK·FK 컬럼 일괄 정리, is_selected 컬럼 추가)
        - p_track_selection_band, p_track_selection_member_band 신설
        - 셋리스트 확정 도메인 신설: p_setlist, p_setlist_band, p_setlist_track, p_setlist_track_session, p_setlist_track_participant
      changes:
        - sqlFile:
            path: changes/002-setlist-selection-refactor.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 003-seed-developer-account
      author: bandage
      comment: |
        개발용 기본 DEVELOPER 계정 시드
        - developer@bandage.com / 11111111 (BCrypt cost=10)
        - p_member, p_member_auth 양쪽 INSERT (멱등 처리)
      changes:
        - sqlFile:
            path: changes/003-seed-developer-account.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 004-trackinfo-and-drop-practice-song
      author: bandage
      comment: |
        BD-70 P1-a/b: TrackInfo 임베디드 도입 및 PracticeSong 제거
        - p_practice: song_id FK/컬럼 제거, track_*(title/artist/album/duration:int/reference) + note 컬럼 추가
        - p_practice_song 테이블 제거
        - p_setlist_track / p_track_selection_item: practice_song_id 제거, duration varchar→int, reference 추가
      changes:
        - sqlFile:
            path: changes/004-trackinfo-and-drop-practice-song.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 005-practice-participant-session-and-setlist-id
      author: bandage
      comment: |
        BD-70 P1-c: 세션/참여자 모델 정합화 + setlistId
        - p_practice.setlist_id 추가
        - p_practice_participant.session_id 추가 + (practice_id, session_id, member_id) UK
        - PracticeSession 엔티티 테이블 제거 후 SessionDef ElementCollection 테이블로 재생성
      changes:
        - sqlFile:
            path: changes/005-practice-participant-session-and-setlist-id.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
  - changeSet:
      id: 006-rename-practice-to-jam
      author: bandage
      comment: |
        BD-70 P2: Practice → Jam 도메인 리네이밍
        - p_practice → p_jam, p_practice_participant → p_jam_participant, p_practice_session → p_jam_session
        - practice_id → jam_id, practice_participant_id → jam_participant_id 컬럼 rename
        - PK/UK/FK 제약명 정리
      changes:
        - sqlFile:
            path: changes/006-rename-practice-to-jam.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
            endDelimiter: ";"
