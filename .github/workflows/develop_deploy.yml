name: Deploy to EC2 (Develop)

on:
  push:
    branches:
      - develop

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: bandage-band-manager

# 동일 EC2 에 대한 배포를 직렬화한다.
# develop 에 push 가 연속 발생하면 여러 배포가 같은 호스트에서 docker compose recreate 를
# 동시에 실행해 컨테이너 rename/삭제 레이스("No such container: <hex>_bandage-band-manager")가 난다.
# 진행 중 배포는 끊지 않고(cancel-in-progress: false) 큐잉하여 한 번에 하나씩만 배포한다.
concurrency:
  group: deploy-develop-ec2
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ECR 전용 IAM 자격으로 러너에 AWS 자격 주입 (S3 키와 분리)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_ECR_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Docker 이미지 빌드 및 ECR 푸시 — 태그 이원화 (dev-<sha> + dev-latest)
      #    - dev-<short_sha> : immutable, 롤백/추적용
      #    - dev-latest      : mutable, docker compose pull 참조 포인트
      - name: Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SHA_TAG="dev-${SHORT_SHA}"
          LATEST_TAG="dev-latest"
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG"

      # 4-1. scp 대상 경로의 소유권을 배포 계정으로 정리한다.
      #      과거에 root 로 생성된 파일이 남아 있으면 scp 의 untar 가
      #      "Cannot open: Permission denied" 로 실패한다.
      - name: Ensure deploy target is writable
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: rocky
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p ~/bandage/scripts/db-init
            sudo chown -R rocky:rocky ~/bandage/docker-compose.yml ~/bandage/scripts 2>/dev/null || true

      # 5. compose 파일과 DB 초기화 스크립트를 EC2 의 ~/bandage/ 로 동기화 (repo 가 single source of truth)
      #    SSH 단계에서 compose pull 이 동작하려면 작업 디렉토리에 compose 파일이 미리 존재해야 함
      #    scripts/db-init 은 compose 가 postgres 에 마운트하므로 함께 배포해야 한다.
      - name: Sync docker-compose.yml & db-init scripts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: rocky
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,scripts/db-init/*"
          target: /home/rocky/bandage
          overwrite: true

      # 6. EC2 SSH — 컨테이너 부팅에 필요한 모든 환경변수를 .env 로 일괄 주입 후 compose up
      #    DB_HOST/REDIS_HOST 는 compose 의 service 명(고정값)이라 GH 시크릿 대상이 아니다.
      #    AWS_REGION 은 워크플로우 레벨의 env.AWS_REGION 을 그대로 재사용한다.
      - name: Deploy to EC2 & Inject ENV
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # ----- Spring profile -----
          PROFILE_ACTIVE: dev
          # ----- App server port -----
          BAND_MANAGER_PORT: "8080"
          # ----- DB (PostgreSQL container) -----
          # 계정 분리: admin(슈퍼유저, 컨테이너 부트스트랩) / owner(Liquibase DDL) / app(런타임 DML)
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_ADMIN: ${{ secrets.DB_ADMIN }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_USER_PASSWORD: ${{ secrets.DB_USER_PASSWORD }}
          DB_OWNER: ${{ secrets.DB_OWNER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          # ----- Redis -----
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          # ----- JWT -----
          JWT_TOKEN_SECRET: ${{ secrets.JWT_TOKEN_SECRET }}
          # ----- AWS (S3 + CloudFront, 앱 런타임 — S3 전용 IAM) -----
          AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_CDN_DOMAIN: ${{ secrets.AWS_CDN_DOMAIN }}
          # ----- OAuth -----
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          KAKAO_OAUTH_CLIENT_ID: ${{ secrets.KAKAO_OAUTH_CLIENT_ID }}
          KAKAO_OAUTH_CLIENT_SECRET: ${{ secrets.KAKAO_OAUTH_CLIENT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: rocky
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,AWS_REGION,PROFILE_ACTIVE,BAND_MANAGER_PORT,DB_NAME,DB_ADMIN,DB_ADMIN_PASSWORD,DB_USER,DB_USER_PASSWORD,DB_OWNER,DB_OWNER_PASSWORD,REDIS_PASSWORD,JWT_TOKEN_SECRET,AWS_S3_ACCESS_KEY_ID,AWS_S3_SECRET_ACCESS_KEY,AWS_S3_BUCKET,AWS_CDN_DOMAIN,GOOGLE_OAUTH_CLIENT_ID,KAKAO_OAUTH_CLIENT_ID,KAKAO_OAUTH_CLIENT_SECRET
          script: |
            set -euo pipefail
            cd ~/bandage

            # scp 가 실행 권한을 보존하지 않으면 postgres 엔트리포인트가
            # "bad interpreter: Permission denied" 로 조용히 실패해 역할이 생성되지 않는다.
            chmod +x scripts/db-init/*.sh

            umask 077
            cat > .env <<EOF
            PROFILE_ACTIVE=${PROFILE_ACTIVE}
            BAND_MANAGER_PORT=${BAND_MANAGER_PORT}
            DB_HOST=postgres
            DB_PORT=5432
            DB_NAME=${DB_NAME}
            DB_ADMIN=${DB_ADMIN}
            DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD}
            DB_USER=${DB_USER}
            DB_USER_PASSWORD=${DB_USER_PASSWORD}
            DB_OWNER=${DB_OWNER}
            DB_OWNER_PASSWORD=${DB_OWNER_PASSWORD}
            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=${REDIS_PASSWORD}
            JWT_TOKEN_SECRET=${JWT_TOKEN_SECRET}
            AWS_S3_ACCESS_KEY_ID=${AWS_S3_ACCESS_KEY_ID}
            AWS_S3_SECRET_ACCESS_KEY=${AWS_S3_SECRET_ACCESS_KEY}
            AWS_REGION=${AWS_REGION}
            AWS_S3_BUCKET=${AWS_S3_BUCKET}
            AWS_CDN_DOMAIN=${AWS_CDN_DOMAIN}
            GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
            KAKAO_OAUTH_CLIENT_ID=${KAKAO_OAUTH_CLIENT_ID}
            KAKAO_OAUTH_CLIENT_SECRET=${KAKAO_OAUTH_CLIENT_SECRET}
            EOF

            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            docker compose pull
            # 이전 배포가 비정상 종료되어 남은(이름 충돌) app 컨테이너 정리
            #  - 정상 컨테이너 'bandage-band-manager' 및 rename 잔여 '<hex>_bandage-band-manager' 모두 포함
            #  - 정리 후 compose up 이 깨끗하게 재생성하므로 'No such container' 재발 방지
            docker ps -aq --filter "name=bandage-band-manager" | xargs -r docker rm -f || true
            docker compose up -d
            docker image prune -f